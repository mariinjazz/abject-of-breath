<div id="notice" role="status"></div><script id="deck-data" type="application/json">[{"title": "Abject of Breath", "status": "", "elements": [{"kind": "image", "src": "collage.png", "x": 0, "y": 0, "w": 1152, "h": 1080, "alt": "Collage of breathing lips, skin textures and Marina’s research", "id": "p1-e0"}, {"kind": "image", "src": "cover-movement.png", "x": 1403.86, "y": -1.72, "w": 590.67, "h": 1083.44, "alt": "Corfu movement research", "position": "50% 50%", "id": "p1-e1"}, {"kind": "image", "src": "cover-gesture.png", "x": 1440.91, "y": 296.31, "w": 479.09, "h": 363.35, "alt": "A second moment in the movement score", "id": "p1-e2"}, {"kind": "image", "src": "cover-detail.png", "x": 1509.14, "y": 642.75, "w": 380.11, "h": 438.97, "alt": "Footwork detail", "id": "p1-e3"}, {"kind": "text", "text": "Abject", "x": 1125.31, "y": 352.23, "w": 586.55, "h": 124.02, "size": 98, "line": 1, "id": "p1-e4"}, {"kind": "text", "text": "of Breath", "x": 1019.45, "y": 414.24, "w": 603, "h": 127.5, "size": 98, "line": 1, "id": "p1-e5"}, {"kind": "text", "text": "Marina\nPravkina", "x": 1157.59, "y": 972, "w": 261, "h": 92, "size": 40, "line": 1.15, "id": "p1-e6"}]}, {"title": "Breath as a compositional system", "status": "", "elements": [{"kind": "panel", "x": 0, "y": 205, "w": 815, "h": 795, "fill": "#dfbeb0", "id": "trial-p2-e0"}, {"kind": "panel", "x": 1300, "y": 305, "w": 620, "h": 660, "fill": "#cbd1c2", "id": "trial-p2-e1"}, {"kind": "text", "text": "Breath as a compositional system", "x": 60, "y": 42, "w": 1810, "h": 118, "size": 76, "line": 1.02, "id": "trial-p2-e2", "heading": true}, {"kind": "text", "text": "Abject of Breath is an artistic research project between choreography, sound practice, live composition and embodied technologies. The project emerges from a growing need to investigate breath as a primary structure for thinking about performance, temporality and presence.\n\nI investigate how repetitive movement transforms breathing, how breath generates sound, and how that sound can, in turn, reorganise movement.\n\nAt its centre is the encounter between the organic breath of the body, continuously changing through effort, fatigue and recovery, and a technological breath created through recording and looping.", "x": 70, "y": 250, "w": 690, "h": 720, "size": 32, "line": 1.23, "justifyFirst": false, "id": "trial-p2-e3", "emphasis": ["breath as a primary structure", "organic breath", "technological breath"]}, {"kind": "image", "src": "breath-triptych.jpg", "x": 885, "y": 215, "w": 475, "h": 710, "alt": "Lips, moving body and breathing face", "id": "trial-p2-e4"}, {"kind": "text", "text": "What sustains rhythm before rhythm becomes music? \n\nBreath is rhythm before rhythm.\nSound before music.\nMovement before choreography.", "x": 1410, "y": 355, "w": 430, "h": 550, "size": 43, "line": 1.2, "color": "#292622", "id": "trial-p2-e5", "heading": true, "emphasis": ["Breath is rhythm before rhythm.", "Sound before music.", "Movement before choreography."]}, {"kind": "text", "text": "02", "x": 1810, "y": 1018, "w": 70, "h": 42, "size": 33, "id": "trial-p2-e6", "heading": true}], "trial": true}, {"title": "Where the research comes from", "status": "", "elements": [{"kind": "panel", "x": 0, "y": 172, "w": 945, "h": 430, "fill": "#dfbeb0", "id": "trial-p3-e0"}, {"kind": "text", "text": "Where the research comes from", "x": 60, "y": 42, "w": 1810, "h": 118, "size": 76, "line": 1.02, "id": "trial-p3-e1", "heading": true}, {"kind": "text", "text": "Over the last years, my artistic practice has evolved through choreography, club culture, sonic experimentation and choreomusical collaborations. My work develops from rhythm-driven footwork rooted in house and jazz club cultures, explored through sound, repetition, deconstruction and physical presence.", "x": 70, "y": 210, "w": 810, "h": 310, "size": 34, "line": 1.2, "id": "trial-p3-e2", "emphasis": ["rhythm-driven footwork"]}, {"kind": "text", "text": "Through Jazzbetween and The Grooves Experience, I explored groove as a choreographic and social force. Repetition and shared rhythm became tools for generating temporary communities and altered states of attention. These works investigated how bodies synchronise, negotiate and transform through collective rhythmic experiences.\n\nIn Movement 1, I developed this dialogue through improvisational research with live musician, including rhythmical body and sound of a saxophonist.", "x": 1030, "y": 210, "w": 810, "h": 385, "size": 29, "line": 1.2, "id": "trial-p3-e3", "emphasis": ["groove as a choreographic and social force"]}, {"kind": "text", "text": "MOVEMENT 1", "x": 75, "y": 525, "w": 420, "h": 55, "size": 39, "line": 1.2, "href": "https://www.youtube.com/watch?v=UH29TdPgrgk", "weight": 700, "id": "trial-p3-e4", "heading": true, "emphasis": ["MOVEMENT 1"]}, {"kind": "text", "text": "The Grooves Experience", "x": 685, "y": 615, "w": 510, "h": 55, "size": 39, "line": 1.2, "href": "https://www.youtube.com/watch?v=Xbuqy-O_mbU", "weight": 700, "id": "trial-p3-e5", "heading": true, "emphasis": ["The Grooves Experience"]}, {"kind": "text", "text": "Jazzbetween", "x": 1310, "y": 615, "w": 535, "h": 55, "size": 39, "line": 1.2, "href": "https://drive.google.com/file/d/1Ek9BtKkAgS8Utlk8tCyvsaclrH5kf4aj/view", "weight": 700, "id": "trial-p3-e6", "heading": true, "emphasis": ["Jazzbetween"]}, {"kind": "image", "src": "movement-1.jpg", "x": 75, "y": 580, "w": 323, "h": 430, "alt": "Movement 1: dancers and a saxophonist", "href": "https://www.youtube.com/watch?v=UH29TdPgrgk", "position": "50% 50%", "id": "trial-p3-e7"}, {"kind": "image", "src": "grooves.jpg", "x": 670, "y": 670, "w": 530, "h": 330, "alt": "The Grooves Experience", "href": "https://www.youtube.com/watch?v=Xbuqy-O_mbU", "id": "trial-p3-e8"}, {"kind": "image", "src": "jazzbetween.jpg", "x": 1295, "y": 670, "w": 565, "h": 330, "alt": "Jazzbetween at Centro Botín", "href": "https://drive.google.com/file/d/1Ek9BtKkAgS8Utlk8tCyvsaclrH5kf4aj/view", "id": "trial-p3-e9"}, {"kind": "text", "text": "03", "x": 1810, "y": 1018, "w": 70, "h": 42, "size": 33, "id": "trial-p3-e10", "heading": true}], "trial": true}, {"title": "Phase 1 - Movement Research: Corfu Forest Theatre", "status": "", "elements": [{"kind": "panel", "x": 900, "y": 210, "w": 1020, "h": 810, "fill": "#dfbeb0", "id": "trial-p4-e0"}, {"kind": "text", "text": "Phase 1 - Movement Research: Corfu Forest Theatre", "x": 60, "y": 42, "w": 1810, "h": 118, "size": 64, "line": 1.02, "id": "trial-p4-e1", "heading": true}, {"kind": "text", "text": "August 2026", "x": 60, "y": 162, "w": 1790, "h": 54, "size": 32, "color": "#46658b", "id": "trial-p4-e2"}, {"kind": "youtube", "x": 60, "y": 255, "w": 640, "h": 360, "alt": "Collage 1 on Breath & Movement", "fallback": "https://www.youtube.com/watch?v=guGL0Cn-jCk", "id": "trial-p4-e3", "youtubeId": "guGL0Cn-jCk"}, {"kind": "youtube", "x": 180, "y": 665, "w": 640, "h": 360, "alt": "Breath Landscape Research", "fallback": "https://www.youtube.com/watch?v=_HHzfdRClJ0", "id": "trial-p4-e4", "youtubeId": "_HHzfdRClJ0"}, {"kind": "text", "text": "Through repetitive footwork, rhythmic patterns and sustained physical movement, I investigated how effort transforms respiration and how fatigue becomes audible.\n\nWorking with an intensified, altered breath, I explored the sounds released through my mouth and how I could modulate them. Some brought me closer to the abject: bodily expressions we might prefer to conceal rather than allow others to hear.\n\nA central discovery was that the relationship moved in both directions: repetitive movement altered my breathing and produced sound; those sounds then generated further movement.\n\nBreath, mouth and voice sounds also began to appear as scores in their own right: sonic echoes of movement, but also independent, nonverbal material with its own expressive qualities.", "x": 960, "y": 260, "w": 860, "h": 720, "size": 32, "line": 1.2, "id": "trial-p4-e5", "emphasis": ["fatigue becomes audible", "the abject", "the relationship moved in both directions", "scores in their own right"]}, {"kind": "text", "text": "04", "x": 1810, "y": 1018, "w": 70, "h": 42, "size": 33, "id": "trial-p4-e6", "heading": true}], "trial": true}, {"title": "Phase 2: MetaLab research", "status": "", "elements": [{"kind": "panel", "x": 440, "y": 250, "w": 710, "h": 790, "fill": "#dfbeb0", "id": "trial-p5-e0"}, {"kind": "panel", "x": 1180, "y": 840, "w": 740, "h": 200, "fill": "#cbd1c2", "id": "trial-p5-e1"}, {"kind": "text", "text": "Phase 2 - Dramaturgy & Technical: MetaLab", "x": 60, "y": 42, "w": 1810, "h": 118, "size": 70, "line": 1.02, "id": "trial-p5-e2", "heading": true}, {"kind": "text", "text": "Metarage · two weeks, December 2026", "x": 60, "y": 162, "w": 1790, "h": 54, "size": 32, "color": "#46658b", "id": "trial-p5-e3"}, {"kind": "text", "text": "Dramaturgy: vulnerability and the abject", "x": 470, "y": 260, "w": 665, "h": 90, "size": 40, "id": "trial-p5-e4", "heading": true}, {"kind": "text", "text": "Breathing often remains hidden beneath virtuosity. I want to place effort, fatigue, recovery and bodily sounds at the centre of the compositional process.\n\nThe title refers to Julia Kristeva’s notion of the abject: what disturbs identity and unsettles boundaries. I approach breath as something intimate that crosses from inside the body into a shared space.\n\nWith Adrián Vega, I want to develop the materials emerging at Corfu into a dramaturgy: investigating what I reveal, control or conceal, and how these tensions generate movement and sound.", "x": 470, "y": 380, "w": 665, "h": 540, "size": 29, "line": 1.18, "id": "trial-p5-e5", "emphasis": ["hidden beneath virtuosity", "Julia Kristeva’s notion of the abject", "what I reveal, control or conceal"]}, {"kind": "text", "text": "What happens when the vulnerable or unfamiliar sounds of the body remain present?", "x": 470, "y": 935, "w": 665, "h": 105, "size": 29, "line": 1.2, "color": "#46658b", "id": "trial-p5-e6"}, {"kind": "text", "text": "The breathing body and recorded breath", "x": 1190, "y": 260, "w": 665, "h": 90, "size": 40, "id": "trial-p5-e7", "heading": true}, {"kind": "text", "text": "I want to develop the materials begun at Corfu through microphones, amplification and live looping (Abelton), investigating the relationship between my breathing body and its recorded or transformed sound.\n\nBreath, footsteps and floor impacts can be accumulated, repeated, stretched and returned to the space. How do these layers affect my movement, listening and timing?", "x": 1190, "y": 380, "w": 665, "h": 475, "size": 31, "line": 1.2, "id": "trial-p5-e8", "emphasis": ["microphones, amplification and live looping", "recorded or transformed sound"]}, {"kind": "text", "text": "A body becomes tired.\nA recording can continue after the action that produced it has disappeared.", "x": 1190, "y": 890, "w": 665, "h": 145, "size": 29, "line": 1.2, "color": "#46658b", "id": "trial-p5-e9"}, {"kind": "text", "text": "", "x": 60, "y": 1015, "w": 300, "h": 38, "size": 26, "id": "trial-p5-e10"}, {"kind": "text", "text": "05", "x": 1810, "y": 1018, "w": 70, "h": 42, "size": 33, "id": "trial-p5-e11", "heading": true}, {"kind": "image", "src": "breath-dramaturgy.png", "x": 60, "y": 270, "w": 350, "h": 620, "alt": "Breath Landscape research: head tilted back, exposing the throat and upper body", "position": "62% 50%", "id": "trial-p5-e12"}], "trial": true}, {"title": "Phase 3: Two bodies of breath", "status": "", "elements": [{"kind": "panel", "x": 0, "y": 215, "w": 900, "h": 365, "fill": "#dfbeb0", "id": "trial-p6-e0"}, {"kind": "panel", "x": 960, "y": 225, "w": 960, "h": 775, "fill": "#cbd1c2", "id": "trial-p6-e1"}, {"kind": "text", "text": "Phase 3 - Two Bodies of Breath", "x": 60, "y": 42, "w": 1810, "h": 118, "size": 76, "line": 1.02, "id": "trial-p6-e2", "heading": true}, {"kind": "text", "text": "The RADAR residency · one week, February 2027 · with saxophonist Ambroos De Schepper", "x": 60, "y": 162, "w": 1790, "h": 54, "size": 32, "color": "#46658b", "id": "trial-p6-e3"}, {"kind": "text", "text": "I want to bring my breathing scores into a live relationship with another breathing body. We might begin by simply standing and breathing together.", "x": 60, "y": 250, "w": 840, "h": 185, "size": 35, "line": 1.2, "id": "trial-p6-e4"}, {"kind": "text", "text": "This research draws on Movement 1 and improvisation sessions with instruments, exploring the relationship between sound and movement.", "x": 60, "y": 455, "w": 840, "h": 110, "size": 29, "line": 1.2, "id": "trial-p6-e5"}, {"kind": "youtube", "x": 140, "y": 595, "w": 640, "h": 360, "label": "Video materials", "detail": "Movement 1 & improvisation sessions", "alt": "Body and saxophone research", "id": "trial-p6-e6", "youtubeId": "Bp0DRFJN3OA", "fallback": "https://www.youtube.com/watch?v=Bp0DRFJN3OA"}, {"kind": "text", "text": "1  Listen and learn", "x": 1010, "y": 250, "w": 830, "h": 50, "size": 41, "weight": 700, "id": "trial-p6-e7-plain-number", "heading": true}, {"kind": "text", "text": "Listen to breath, mouth sounds, air and saliva through the instrument. Explore effort and musicians’ breathing techniques, including circular breathing, as resources for scores.", "x": 1010, "y": 306, "w": 820, "h": 135, "size": 28, "line": 1.16, "id": "trial-p6-e8", "emphasis": ["breathing techniques"]}, {"kind": "text", "text": "2  Develop shared scores", "x": 1010, "y": 435, "w": 830, "h": 50, "size": 41, "weight": 700, "id": "trial-p6-e9-plain-number", "heading": true}, {"kind": "text", "text": "Bring breath and saxophone into relation with repetitive footwork and prolonged movement. Test shared timing, effort, interruption and recovery.", "x": 1010, "y": 491, "w": 820, "h": 135, "size": 28, "line": 1.16, "id": "trial-p6-e10"}, {"kind": "text", "text": "3  Record, transform and reflect", "x": 1010, "y": 620, "w": 830, "h": 50, "size": 41, "weight": 700, "id": "trial-p6-e11-plain-number", "heading": true}, {"kind": "text", "text": "Amplify, loop and layer intimate sounds; share the operation of sound. What changes when breath continues apart from its body? Record and reflect on experiments.", "x": 1010, "y": 676, "w": 820, "h": 135, "size": 28, "line": 1.16, "id": "trial-p6-e12", "emphasis": ["breath continues apart from its body"]}, {"kind": "text", "text": "4  Explore a hybrid body", "x": 1010, "y": 805, "w": 830, "h": 50, "size": 41, "weight": 700, "id": "trial-p6-e13-plain-number", "heading": true}, {"kind": "text", "text": "How do posture and movement tasks change the musician’s breath and sound? Explore direct bodily contact: can dancer, musician and saxophone become a hybrid body?", "x": 1010, "y": 861, "w": 820, "h": 135, "size": 28, "line": 1.16, "id": "trial-p6-e14", "emphasis": ["direct bodily contact", "hybrid body"]}, {"kind": "text", "text": "06", "x": 1810, "y": 1018, "w": 70, "h": 42, "size": 33, "id": "trial-p6-e15", "heading": true}], "trial": true}, {"title": "Working calendar and project development", "status": "", "elements": [{"kind": "panel", "x": 0, "y": 210, "w": 535, "h": 840, "fill": "#dfbeb0", "id": "trial-p7-e0"}, {"kind": "panel", "x": 535, "y": 815, "w": 1385, "h": 235, "fill": "#cbd1c2", "id": "trial-p7-e1"}, {"kind": "text", "text": "Working Calendar & Project Development", "x": 60, "y": 42, "w": 1810, "h": 118, "size": 76, "line": 1.02, "id": "trial-p7-e2", "heading": true}, {"kind": "text", "text": "August 2026", "x": 60, "y": 245, "w": 420, "h": 55, "size": 48, "id": "trial-p7-e3", "heading": true}, {"kind": "text", "text": "Corfu Forest Theatre\nCompleted research", "x": 60, "y": 315, "w": 450, "h": 105, "size": 31, "line": 1.23, "color": "#46658b", "id": "trial-p7-e4"}, {"kind": "text", "text": "Establish a physical vocabulary of repetitive movement, altered breath, mouth sounds and the movement that emerges in response.", "x": 580, "y": 245, "w": 1245, "h": 138, "size": 35, "line": 1.18, "id": "trial-p7-e5"}, {"kind": "text", "text": "December 2026", "x": 60, "y": 443, "w": 470, "h": 55, "size": 48, "id": "trial-p7-e6", "heading": true}, {"kind": "text", "text": "MetaLab at Metarage\nTwo weeks proposed", "x": 60, "y": 511, "w": 450, "h": 105, "size": 31, "line": 1.23, "color": "#46658b", "id": "trial-p7-e7"}, {"kind": "text", "text": "Dramaturgical dialogue with Adrián Vega and technical experiments with microphones, amplification and live looping. Residency support confirmed.", "x": 580, "y": 443, "w": 1245, "h": 138, "size": 35, "line": 1.18, "id": "trial-p7-e8"}, {"kind": "text", "text": "February 2027", "x": 60, "y": 640, "w": 470, "h": 55, "size": 48, "id": "trial-p7-e9", "heading": true}, {"kind": "text", "text": "RADAR residency: one week\nMetaLab open doors: one week", "x": 60, "y": 708, "w": 490, "h": 110, "size": 29, "line": 1.23, "color": "#46658b", "id": "calendar-february-weeks-v2", "emphasis": ["RADAR residency: one week"]}, {"kind": "text", "text": "At RADAR, test the encounter between two breathing bodies with a saxophonist. Mentoring and artistic feedback will help me reflect on what emerges from these experiments.\n\nFinal opening of the residency MetaLab.", "x": 580, "y": 640, "w": 1245, "h": 185, "size": 30, "line": 1.15, "id": "calendar-february-description-v2"}, {"kind": "text", "text": "7–18 April 2027", "x": 60, "y": 847, "w": 490, "h": 60, "size": 48, "id": "trial-p7-e12", "heading": true}, {"kind": "text", "text": "Outside In Festival\nWork-in-progress presentation", "x": 60, "y": 915, "w": 495, "h": 100, "size": 30, "line": 1.2, "color": "#46658b", "id": "trial-p7-e13", "emphasis": ["Work-in-progress presentation"]}, {"kind": "text", "text": "Share the research in a work-in-progress presentation at Outside In Festival. Exchange with audiences and artists to inform the composition and its further development. Presentation day within the festival to be agreed.", "x": 580, "y": 847, "w": 1245, "h": 185, "size": 35, "line": 1.18, "id": "trial-p7-e14"}, {"kind": "text", "text": "07", "x": 1810, "y": 1018, "w": 70, "h": 42, "size": 33, "id": "trial-p7-e15", "heading": true}], "trial": true}, {"title": "Open Questions of the research", "trial": true, "status": "", "elements": [{"kind": "panel", "x": 0, "y": 215, "w": 935, "h": 765, "fill": "#dfbeb0", "id": "open-questions-v1-e0"}, {"kind": "panel", "x": 990, "y": 300, "w": 930, "h": 680, "fill": "#cbd1c2", "id": "open-questions-v1-e1"}, {"kind": "text", "text": "Open Questions of Futher Research", "x": 60, "y": 42, "w": 1800, "h": 115, "size": 76, "line": 1.22, "heading": true, "id": "open-questions-v1-e2"}, {"kind": "text", "text": "Connection with the audience", "x": 65, "y": 260, "w": 810, "h": 70, "size": 44, "line": 1.22, "heading": true, "id": "open-questions-v1-e3"}, {"kind": "text", "text": "How might breath become a resource for connection with an audience?\n\nHow do spectators listen to breath, effort and repetition?\n\nWhere does their attention move?\n\nWhat physical responses might my breathing scores evoke?\n\nCould this research open towards a collective breathing experience?", "x": 65, "y": 365, "w": 810, "h": 575, "size": 34, "line": 1.22, "emphasis": ["connection with an audience", "collective breathing experience"], "id": "open-questions-v1-e4"}, {"kind": "text", "text": "Format of the performance", "x": 1050, "y": 245, "w": 800, "h": 70, "size": 44, "line": 1.22, "heading": true, "id": "open-questions-v1-e5"}, {"kind": "text", "text": "What form of performance does the work need?\n\nA solo?\n\nA solo with sound materials created together with a saxophonist?\n\nWhat does the musician’s live presence and body bring to the work?\n\nA live duet?", "x": 1050, "y": 365, "w": 800, "h": 570, "size": 36, "line": 1.22, "emphasis": ["What form of performance does the work need?", "live presence and body", "A live duet?"], "id": "open-questions-v1-e6"}, {"kind": "text", "text": "", "x": 65, "y": 1005, "w": 1680, "h": 45, "size": 29, "line": 1.22, "color": "#46658b", "id": "open-questions-v1-e7"}, {"kind": "text", "text": "08", "x": 1810, "y": 1018, "w": 70, "h": 42, "size": 33, "line": 1.22, "id": "open-questions-v1-e8"}]}]</script><script src="presentation.js"></script></body></html>
